name: Build Applio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Placeholder / Artifact
        run: |
          mkdir -p build-output
          echo "Applio APK Build Simulation" > build-output/applio-build.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applio-APK
          path: build-output/
